{% extends "layout.html" %}

{% block content %}
<div class="hero min-h-screen bg-gradient-to-br from-primary/20 to-secondary/20">
    <div class="hero-content text-center">
        <div class="max-w-2xl">
            <div class="mb-8">
                <i class="bi bi-wallet2 text-8xl text-primary"></i>
            </div>
            <h1 class="text-6xl font-bold mb-4">Finance Tracker</h1>
            <p class="text-2xl mb-8">Personal funds, income, expenses</p>
            <p class="text-lg mb-8 text-base-content/70">
                Take control of your finances. Track your income and expenses with ease.
            </p>
            <div class="flex gap-4 justify-center">
                <a href="{{ url_for('login_user_get') }}" class="btn btn-primary btn-lg gap-2">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Sign In
                </a>
                <a href="{{ url_for('register_user_get') }}" class="btn btn-outline btn-lg gap-2">
                    <i class="bi bi-person-plus"></i>
                    Sign Up
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
